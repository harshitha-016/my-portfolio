<section id="contact" style="padding: 60px 40px; background-color: #fff;">
  <h2 style="text-align: center; color: #e91e63;">Contact Me</h2>
  <form action="https://formspree.io/f/xblygozb" method="POST" style="max-width: 600px; margin: auto;">
    <label>Name:</label>
    <input type="text" name="name" required style="width:100%; padding: 10px; margin-bottom: 15px;" />

    <label>Email:</label>
    <input type="email" name="email" required style="width:100%; padding: 10px; margin-bottom: 15px;" />

    <label>Message:</label>
    <textarea name="message" rows="5" required style="width:100%; padding: 10px; margin-bottom: 15px;"></textarea>

    <button type="submit" style="padding: 12px 24px; background: #e91e63; color: white; border: none; border-radius: 25px; cursor: pointer;">
      Send Message
    </button>
  </form>
</section>
